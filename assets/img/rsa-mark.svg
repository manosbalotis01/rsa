<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="RSA emblem" fill="none">
  <!-- orange open ring / swoosh -->
  <circle cx="24" cy="24" r="20" stroke="#F5811F" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="99 26" transform="rotate(128 24 24)"/>
  <!-- purple gear teeth -->
  <g stroke="#6B2D91" stroke-width="3.4" stroke-linecap="round">
    <line x1="35"   y1="24"   x2="38.5" y2="24"/>
    <line x1="31.78" y1="31.78" x2="34.25" y2="34.25"/>
    <line x1="24"   y1="35"   x2="24"   y2="38.5"/>
    <line x1="16.22" y1="31.78" x2="13.75" y2="34.25"/>
    <line x1="13"   y1="24"   x2="9.5"  y2="24"/>
    <line x1="16.22" y1="16.22" x2="13.75" y2="13.75"/>
    <line x1="24"   y1="13"   x2="24"   y2="9.5"/>
    <line x1="31.78" y1="16.22" x2="34.25" y2="13.75"/>
  </g>
  <!-- purple gear ring -->
  <circle cx="24" cy="24" r="11" stroke="#6B2D91" stroke-width="3.4"/>
  <!-- green molecule / atom -->
  <g stroke="#6DB22B" stroke-width="2.2" stroke-linecap="round">
    <line x1="24" y1="24" x2="19" y2="20"/>
    <line x1="24" y1="24" x2="29.5" y2="21"/>
    <line x1="24" y1="24" x2="22.5" y2="29.5"/>
  </g>
  <g fill="#6DB22B">
    <circle cx="24" cy="24" r="3"/>
    <circle cx="18.5" cy="19.5" r="2.3"/>
    <circle cx="30" cy="20.5" r="2.3"/>
    <circle cx="22" cy="30" r="2.3"/>
  </g>
</svg>
